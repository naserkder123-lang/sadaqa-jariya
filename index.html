نه<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدقة جارية - لوالدي ووالدتي</title>
    
    <!-- إعدادات تطبيق الـ PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F3D2E">
    
    <!-- تنسيقات التصميم -->
    <style>
        body {
            background-color: #0F3D2E;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        /* يمكنك إضافة بقية تنسيقاتك هنا */
    </style>
</head>
<body>

    <div class="container">
        <h1>بسم الله الرحمن الرحيم</h1>
        <h2>صدقة جارية</h2>
        <p>لوالدتي النخيل الماحي</p>
        <p>ولوالدي خضر إبراهيم</p>
        <p>تقبل الله منهما وأسكنهما فسيح جناته</p>
    </div>

    <script>
        // تسجيل الـ Service Worker لتفعيل التطبيق ودعم العمل دون إنترنت إن وجد
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
