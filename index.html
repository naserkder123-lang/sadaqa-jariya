    <!-- شريط علوي يحتوي على عداد الزوار -->
    <div class="top-bar">
        <div></div> <!-- فراغ للموازنة -->
        <div class="visitor-counter">
            <i class="fas fa-eye" style="color: #1b4332;"></i>
            <span>عدد الزوار: </span>
            <span id="visits-count">...</span>
        </div>
    </div>

    <!-- محتوى التطبيق الرئيسي -->
    <div class="main-card">
        <h1>صدقة جارية</h1>
        <div class="subtitle">سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى</div>

        <div class="dhikr-box">
            سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ
        </div>

        <div class="counter-number" id="counter">0</div>

        <button class="btn" onclick="incrementCounter()">تسبيح</button>

        <div class="secondary-btns">
            <button class="btn-secondary" onclick="nextDhikr()">الذكر التالي</button>
            <button class="btn-secondary" onclick="resetCounter()">إعادة ضبط</button>
        </div>

        <div class="footer-text">
            تطبيق صدقة جارية - يعمل بدون اتصال بالإنترنت
        </div>
    </div>

    <!-- كود البرمجة ووظيفة العداد -->
    <script>
        // منطق العداد البسيط للتسبيح
        let count = 0;
        function incrementCounter() {
            count++;
            document.getElementById('counter').innerText = count;
        }

        function resetCounter() {
            count = 0;
            document.getElementById('counter').innerText = count;
        }

        function nextDhikr() {
            resetCounter();
            // يمكنك إضافة تنقل بين الأذكار هنا مستقبلاً
        }

        // دالة جلب وتحديث عداد الزوار التلقائي
        function updateVisitorCount() {
            const namespace = 'sadaqa-jariya-naserkder123';
            const key = 'visits';

            fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('visits-count').innerText = data.value.toLocaleString('ar-EG');
                })
                .catch(error => {
                    console.error('خطأ في جلب عداد الزوار:', error);
                    document.getElementById('visits-count').innerText = '1';
                });
        }

        // تشغيل العداد عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', updateVisitorCount);
    </script>
